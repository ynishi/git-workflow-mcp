[package]
name = "git-workflow-mcp"
version = "0.2.0"
edition = "2024"
description = "Git workflow MCP server for Olympian Agent pipeline"
license = "MIT OR Apache-2.0"
authors = ["Yutaka Nishimura"]
repository = "https://github.com/ynishi/git-workflow-mcp"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
futures = "0.3"
rmcp = { version = "0.16", features = ["server", "transport-io", "macros"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
insta = { version = "1", features = ["json", "redactions"] }
regex = "1"
rmcp = { version = "0.16", features = ["client", "transport-child-process"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
